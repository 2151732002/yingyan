services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: yingyan
      MYSQL_USER: yingyan
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h127.0.0.1 -u"$$MYSQL_USER" -D"$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build: ./backend
    environment:
      PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/yingyan?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USER: yingyan
      DB_PASSWORD: ${DB_PASSWORD}
      YINGYAN_ADMIN_USERNAME: ${YINGYAN_ADMIN_USERNAME:-director}
      YINGYAN_ADMIN_PASSWORD: ${YINGYAN_ADMIN_PASSWORD:?Set YINGYAN_ADMIN_PASSWORD in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-4.1-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      SPEECH_API_KEY: ${SPEECH_API_KEY:-}
      SPEECH_BASE_URL: ${SPEECH_BASE_URL:-https://api.deepseek.com}
      STORAGE_DIR: /app/data/assets
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3100,http://127.0.0.1:3100}
    ports:
      - 127.0.0.1:18080:8080
    volumes:
      - studio-assets:/app/data
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: http://backend:8080
    ports:
      - 127.0.0.1:3100:3000
    depends_on:
      - backend
volumes:
  mysql-data:
  studio-assets:
