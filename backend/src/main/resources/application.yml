server:
  port: ${PORT:18080}
spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/yingyan?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:yingyan}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
management:
  endpoints:
    web:
      exposure:
        include: health
yingyan:
  admin-username: ${YINGYAN_ADMIN_USERNAME:director}
  admin-password: ${YINGYAN_ADMIN_PASSWORD:}
  storage: ${STORAGE_DIR:./data/assets}
  cookie-secure: ${COOKIE_SECURE:false}
  allowed-origins: ${ALLOWED_ORIGINS:http://127.0.0.1:3100,http://localhost:3100}
  ai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_TEXT_MODEL:gpt-4.1-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
